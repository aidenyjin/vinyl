<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vinyl</title>
<meta name="description" content="A turntable that shows what your Mac is playing.">
<meta name="theme-color" content="#1c221f">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vinyl">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app" id="app" data-playing="false" data-mode="demo">
  <div class="stage" id="stage">
    <div class="deck" aria-hidden="true">
      <div class="plinth"></div>
      <span class="mark">Vinyl</span>
      <div class="platter"><div class="strobe" id="strobe"></div></div>
      <div class="record" id="record">
        <div class="vinyl"></div>
        <div class="spin" id="spin">
          <div class="label" id="label">
            <div class="blank"><span>33⅓</span></div>
          </div>
        </div>
        <div class="sheen" id="sheen"></div>
      </div>
      <div class="lamp"></div>
      <div class="spindle"></div>
      <svg class="arm-base" viewBox="-20 -30 40 180">
        <defs>
          <radialGradient id="baseRing" cx="0.4" cy="0.35" r="0.8">
            <stop offset="0" stop-color="#e9e9e5"/>
            <stop offset="0.55" stop-color="#9c9c98"/>
            <stop offset="1" stop-color="#4a4a48"/>
          </radialGradient>
        </defs>
        <circle r="14.5" fill="#141414"/>
        <circle r="11" fill="url(#baseRing)"/>
        <circle r="8.6" fill="#1b1b1b"/>
        <circle cx="6.63" cy="94.77" r="4.6" fill="#141414"/>
        <circle cx="6.63" cy="94.77" r="2.4" fill="url(#baseRing)"/>
      </svg>
      <svg class="arm-shadow" id="armShadow" viewBox="-20 -30 40 180">
        <defs>
          <filter id="soft" x="-50%" y="-10%" width="200%" height="120%"><feGaussianBlur stdDeviation="1.8"/></filter>
        </defs>
        <g filter="url(#soft)" fill="#000">
          <rect x="-8.5" y="-29" width="17" height="15" rx="2.5"/>
          <rect x="-1.6" y="-15" width="3.2" height="144" rx="1.6"/>
          <circle r="6.5"/>
          <g transform="translate(0 127) rotate(24)"><rect x="-4.6" y="-1" width="9.2" height="19.5" rx="1.6"/><rect x="4" y="2" width="7" height="2.6" rx="1.3"/></g>
        </g>
      </svg>
      <svg class="arm" id="arm" viewBox="-20 -30 40 180">
        <defs>
          <linearGradient id="tube" x1="0" x2="1">
            <stop offset="0" stop-color="#7d7d7a"/>
            <stop offset="0.35" stop-color="#f6f6f3"/>
            <stop offset="0.6" stop-color="#cfcfcb"/>
            <stop offset="1" stop-color="#6e6e6b"/>
          </linearGradient>
          <linearGradient id="weight" x1="0" x2="1">
            <stop offset="0" stop-color="#2c2c2c"/>
            <stop offset="0.3" stop-color="#8f8f8b"/>
            <stop offset="0.48" stop-color="#d6d6d2"/>
            <stop offset="0.75" stop-color="#6d6d6a"/>
            <stop offset="1" stop-color="#262626"/>
          </linearGradient>
          <radialGradient id="cap" cx="0.38" cy="0.32" r="0.75">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="0.45" stop-color="#c9c9c5"/>
            <stop offset="1" stop-color="#5f5f5c"/>
          </radialGradient>
        </defs>
        <rect x="-8.5" y="-29" width="17" height="15" rx="2.5" fill="url(#weight)"/>
        <rect x="-8.5" y="-24.6" width="17" height="0.7" fill="#000" opacity="0.35"/>
        <rect x="-8.5" y="-19.4" width="17" height="0.7" fill="#000" opacity="0.35"/>
        <rect x="-2.1" y="-15" width="4.2" height="12" fill="url(#tube)"/>
        <rect x="-1.35" y="0" width="2.7" height="129" rx="1.35" fill="url(#tube)"/>
        <circle r="6.5" fill="url(#cap)"/>
        <circle r="2.4" fill="#262626"/>
        <g transform="translate(0 127) rotate(24)">
          <rect x="-4.6" y="-1" width="9.2" height="19.5" rx="1.6" fill="#1c1c1c"/>
          <rect x="-3.3" y="9.5" width="6.6" height="7.5" rx="1" fill="#3b3b3b"/>
          <path d="M4.4 2 H10.3 A1.3 1.3 0 0 1 10.3 4.6 H4.4 Z" fill="#c9c9c5"/>
          <rect x="-0.45" y="17" width="0.9" height="1.5" fill="#e6e6e2"/>
        </g>
      </svg>
    </div>

    <div class="strip" role="group" aria-label="Playback">
      <button class="key play" id="play" type="button" aria-label="Play">
        <svg class="icon i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.3v13.4a.9.9 0 0 0 1.4.8l10.4-6.7a.9.9 0 0 0 0-1.6L9.4 4.5A.9.9 0 0 0 8 5.3z"/></svg>
        <svg class="icon i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.2" y="5" width="4" height="14" rx="1"/><rect x="13.8" y="5" width="4" height="14" rx="1"/></svg>
      </button>
      <button class="key" id="prev" type="button" aria-label="Previous song">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5.5h2.2v13H6zM19 6.2v11.6a.8.8 0 0 1-1.2.7L9.4 12.7a.8.8 0 0 1 0-1.4l8.4-5.8a.8.8 0 0 1 1.2.7z"/></svg>
      </button>
      <button class="key" id="next" type="button" aria-label="Next song">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.8 5.5H18v13h-2.2zM5 6.2v11.6a.8.8 0 0 0 1.2.7l8.4-5.8a.8.8 0 0 0 0-1.4L6.2 5.5A.8.8 0 0 0 5 6.2z"/></svg>
      </button>
      <div class="fader" id="knob" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="64">
        <span class="groove"><span class="level" id="knobLevel"></span></span>
        <span class="cap" id="knobCap"></span>
      </div>
      <span class="vol" id="knobValue" aria-hidden="true">64</span>
    </div>

    <section class="panel" id="panel" aria-label="Now playing">
      <div class="meta" id="meta" aria-live="polite">
        <h1 class="title" id="title">Clair de lune</h1>
        <p class="artist" id="artist">Claude Debussy</p>
        <p class="album" id="album">Suite bergamasque</p>
      </div>

      <div class="foot">
        <div class="progress">
          <div class="scrub" id="scrub" role="slider" tabindex="0" aria-label="Song position" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
            <div class="track"></div>
            <div class="fill" id="fill"></div>
            <div class="thumb" id="thumb"></div>
          </div>
          <div class="times"><span id="elapsed">0:00</span><span id="remaining">-0:00</span></div>
        </div>
        <p class="source" id="source"><span class="dot" aria-hidden="true"></span><span id="sourceText">Demo playlist</span></p>
        <p class="credit" id="credit"></p>
      </div>
    </section>

    <button class="corner" id="fullscreen" type="button" aria-label="Full screen">
      <svg class="i-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      <svg class="i-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
    </button>
    <p class="keys"><span><kbd>Space</kbd> play or pause</span><span><kbd>←</kbd><kbd>→</kbd> skip</span><span><kbd>↑</kbd><kbd>↓</kbd> volume</span><span><kbd>F</kbd> full screen</span></p>
  </div>
</main>
<script src="demo.js"></script>
<script src="app.js"></script>
</body>
</html>
