<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vinyl</title>
<meta name="description" content="A turntable that shows what your Mac is playing.">
<meta name="theme-color" content="#efece6">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vinyl">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app" id="app" data-playing="false" data-mode="demo">
  <!-- The cover, washed into paper and turning slowly behind everything. -->
  <div class="ambient" id="ambient" aria-hidden="true"></div>

  <div class="stage">
    <div class="deck" aria-hidden="true">
      <!-- The record lives half inside its sleeve: out to play, back in to pause. -->
      <div class="retract">
        <div class="record" id="record">
          <div class="vinyl"></div>
          <div class="spin" id="spin"><div class="label" id="label"><span class="blank">Vinyl</span></div></div>
          <div class="sheen" id="sheen"></div>
        </div>
        <div class="spindle"></div>
      </div>
      <div class="sleeve" id="sleeve"></div>

      <svg class="arm-base" viewBox="-20 -30 40 180"><circle r="11" class="plate"/></svg>
      <svg class="arm-shadow" id="armShadow" viewBox="-20 -30 40 180">
        <defs><filter id="soft" x="-50%" y="-10%" width="200%" height="120%"><feGaussianBlur stdDeviation="1.4"/></filter></defs>
        <g filter="url(#soft)" fill="#000">
          <rect x="-5" y="-28" width="10" height="13" rx="2.5"/>
          <rect x="-1.1" y="-15" width="2.2" height="144" rx="1.1"/>
          <circle r="5.5"/>
          <g transform="translate(0 127) rotate(24)"><rect x="-3.4" y="0" width="6.8" height="17" rx="1.6"/></g>
        </g>
      </svg>
      <svg class="arm" id="arm" viewBox="-20 -30 40 180">
        <defs>
          <linearGradient id="metal" x1="0" x2="1">
            <stop offset="0" stop-color="#a7a9ad"/><stop offset="0.38" stop-color="#f5f5f7"/>
            <stop offset="0.62" stop-color="#dadbde"/><stop offset="1" stop-color="#9a9ca0"/>
          </linearGradient>
          <radialGradient id="cap" cx="0.38" cy="0.34" r="0.7"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#b6b8bc"/></radialGradient>
        </defs>
        <rect x="-5" y="-28" width="10" height="13" rx="2.5" fill="url(#metal)"/>
        <rect x="-1.1" y="-15" width="2.2" height="144" rx="1.1" fill="url(#metal)"/>
        <circle r="5.5" fill="url(#cap)"/>
        <circle r="1.8" fill="#8b8d92"/>
        <g transform="translate(0 127) rotate(24)">
          <rect x="-3.4" y="0" width="6.8" height="16" rx="1.6" fill="#e9eaec"/>
          <rect x="-2.6" y="9" width="5.2" height="7" rx="1" fill="#1c1c1f"/>
          <rect x="-0.4" y="16" width="0.8" height="2" fill="#c9cacd"/>
          <rect x="3" y="2.4" width="5.2" height="1.6" rx="0.8" fill="#e9eaec"/>
        </g>
      </svg>
    </div>

    <section class="panel" aria-label="Now playing">
      <div class="meta" aria-live="polite">
        <h1 class="title" id="title"></h1>
        <p class="sub" id="sub"></p>
      </div>

      <div class="transport" role="group" aria-label="Playback">
        <button class="tbtn" id="prev" type="button" aria-label="Previous" title="Previous (←)">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M15 10.4v11.2a1 1 0 0 1-1.55.83L5.3 17a1.2 1.2 0 0 1 0-2l8.15-5.43A1 1 0 0 1 15 10.4Zm12 0v11.2a1 1 0 0 1-1.55.83L17.3 17a1.2 1.2 0 0 1 0-2l8.15-5.43A1 1 0 0 1 27 10.4Z"/></svg>
        </button>
        <button class="tbtn play" id="play" type="button" aria-label="Play" title="Play (Space)">
          <svg class="icon i-play" viewBox="0 0 32 32" aria-hidden="true"><path d="M10 6.9v18.2a1.3 1.3 0 0 0 1.97 1.11l14.6-9.1a1.3 1.3 0 0 0 0-2.22l-14.6-9.1A1.3 1.3 0 0 0 10 6.9Z"/></svg>
          <svg class="icon i-pause" viewBox="0 0 32 32" aria-hidden="true"><rect x="8" y="6.5" width="5.4" height="19" rx="1.4"/><rect x="18.6" y="6.5" width="5.4" height="19" rx="1.4"/></svg>
        </button>
        <button class="tbtn" id="next" type="button" aria-label="Next" title="Next (→)">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M17 10.4v11.2a1 1 0 0 0 1.55.83L26.7 17a1.2 1.2 0 0 0 0-2l-8.15-5.43A1 1 0 0 0 17 10.4Zm-12 0v11.2a1 1 0 0 0 1.55.83L14.7 17a1.2 1.2 0 0 0 0-2L6.55 9.57A1 1 0 0 0 5 10.4Z"/></svg>
        </button>
      </div>

      <div class="progress">
        <div class="scrub" id="scrub" role="slider" tabindex="0" aria-label="Song position" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
          <div class="bar"><div class="fill" id="fill"></div></div>
        </div>
        <div class="times"><span id="elapsed">0:00</span><span id="remaining">-0:00</span></div>
      </div>

      <div class="volume">
        <svg class="vicon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9.5h2.6L12 6v12l-4.4-3.5H5a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1Z"/></svg>
        <div class="scrub" id="vol" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="64" title="Volume (↑ ↓)">
          <div class="bar"><div class="fill" id="volFill"></div></div>
        </div>
        <svg class="vicon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.5h2.6L10 6v12l-4.4-3.5H3a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1Z"/><path class="wave" d="M13.6 9.2a4 4 0 0 1 0 5.6M16.4 6.6a7.6 7.6 0 0 1 0 10.8"/></svg>
      </div>
    </section>

    <header class="top">
      <p class="source" id="source"></p>
      <button class="corner" id="fullscreen" type="button" aria-label="Full screen" title="Full screen (F)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 9V4.5H9M19.5 9V4.5H15M4.5 15v4.5H9M19.5 15v4.5H15"/></svg>
      </button>
    </header>
    <p class="credit" id="credit"></p>
  </div>
</main>
<script src="demo.js"></script>
<script src="app.js"></script>
</body>
</html>
